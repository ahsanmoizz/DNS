services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: daily_identity
      POSTGRES_USER: daily
      POSTGRES_PASSWORD: daily
    ports: ["5432:5432"]
    volumes: ["daily-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  daily-postgres:
